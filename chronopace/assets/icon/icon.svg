<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1A2B"/>
      <stop offset="1" stop-color="#060A11"/>
    </linearGradient>
    <linearGradient id="em" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#28F58C"/>
      <stop offset="0.55" stop-color="#00E676"/>
      <stop offset="1" stop-color="#00B357"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#1B2E49" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1B2E49" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- Obsidian background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#vign)"/>

  <!-- Dial rings (nod to the in-app pulse visualizer) -->
  <circle cx="512" cy="512" r="372" fill="none" stroke="#00E676" stroke-opacity="0.13" stroke-width="10"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#00E676" stroke-opacity="0.06" stroke-width="6"/>

  <!-- Cadence pulse waveform: glow layer -->
  <path d="M 196 512 L 344 512 L 410 372 L 476 652 L 542 300 L 608 652 L 674 430 L 740 512 L 828 512"
        fill="none" stroke="#00E676" stroke-opacity="0.55" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Cadence pulse waveform: solid -->
  <path d="M 196 512 L 344 512 L 410 372 L 476 652 L 542 300 L 608 652 L 674 430 L 740 512 L 828 512"
        fill="none" stroke="url(#em)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
